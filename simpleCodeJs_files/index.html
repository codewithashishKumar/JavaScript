<body>
    <p>JavaScript Essentials</p>

<script defer>
    console.log("Hello");
    let username = "Alex";
    const country = "India";

    console.log(username);
    console.log(country);

    // Data Types
    console.log(typeof "Hello");
    console.log(typeof 25);
    console.log(typeof true);
    console.log(typeof undefined);
    console.log(typeof null);
    console.log(typeof 123n);
    console.log(typeof Symbol("id"));
    console.log(typeof {});
    let a = 4.9
    Math.trunc(a);
    console.log(a)
    let b = Math.max(10, 20, 5, 30);
    console.log(b);
    let c = Math.floor(Math.random() * (10 - 5 + 1)) + 5;
    console.log(c);
    let radius = 5;
    let area = Math.floor(Math.PI * radius ** 2);
    console.log(area);
</script>
