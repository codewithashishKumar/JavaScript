        const hour12 = hour % 12 || 12;

        const minute = date.getMinutes();
        const sec = date.getSeconds();
        const text = `Today is ${today} - ${todayDate}/${month}/${year}  and time is ${hour12}:${minute}:${sec} ${ampm}`;
