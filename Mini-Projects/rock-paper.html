<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #f7f5eb;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
    }

    .header {
        width: 100%;
        text-align: center;
        padding: 20px;
        background-color: #000;
        color: #fff;
    }

    .svgContainer {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px;
        gap: 20px;
    }

    .rock,
    .paper,
    .scissors {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        cursor: pointer;
    }

    .rock {
        background-color: rgb(193, 98, 113);
    }

    .paper {
        background-color: rgb(77, 197, 77);
    }

    .scissors {
        background-color: rgb(102, 102, 194);
    }

    .results {
        display: flex;
        flex-direction: column;
        width: 100%;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding: 20px;
    }

    .stats {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding: 20px;
    }



    .user,
    .comp {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100px;
    }

    .resultInfo {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding: 20px;
        background-color: #000;
        color: #fff;
        border-radius: 20px;
    }

    .resetGame {
        position: relative;
        width: 80px;
        height: 30px;
        outline: none;
        border: 1px solid #000;
        background-color: transparent;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        z-index: 1;
    }

    .resetGame::after {
        content: '';
        position: absolute;
        width: 0;
        bottom: 0;
        left: 0;
        height: 100%;
        background-color: #000;
        transition: all 0.5s ease;
        z-index: -1;
    }

    .resetGame:hover {
        color: #fff;
    }

    .resetGame:hover::after {
        width: 80px;
        color: #fff;
    }
</style>

<body>
    <div class="header">
        <h1>Rock Paper Scissors</h1>
    </div>
    <div class="svgContainer">
        <div class="rock box" id="rock">rock</div>
        <div class="paper box" id="paper">paper</div>
        <div class="scissors box" id="scissor">scissor</div>
    </div>
    <div class="results">
        <div class="stats">
            <div class="user">
                <p id="user">0</p>
                <span>You</span>
            </div>
            <div class="comp">
                <p id="comp">0</p>
                <span>Computer</span>
            </div>
        </div>
        <div class="resultInfo">Pick Your Move</div>
        <button class="resetGame" id="resetGame">Reset</button>
    </div>
</body>
<script>
    let values = ["rock", "paper", "scissor"];
    let userCount = 0;
    let compCount = 0;
    let resultDiv = document.querySelector('.resultInfo');
    let userInfo = document.getElementById('user');
    let compInfo = document.getElementById('comp');

    let buttons = document.querySelectorAll('.box');
    buttons.forEach((box) => {
        box.addEventListener('click', () => {
            let userValue = box.getAttribute('id');
            console.log(userValue);
            let compValue = values[Math.floor(Math.random() * values.length)];
            console.log(compValue);
            if (userValue === compValue) {
                console.log("Draw");
                resultDiv.innerHTML = 'Game Draw';
                resultDiv.style.backgroundColor = '#000';
            } else if (
                (userValue === "rock" && compValue === "scissor") ||
                (userValue === "paper" && compValue === "rock") ||
                (userValue === "scissor" && compValue === "paper")
            ) {
                console.log("User Wins");
                userCount = userCount + 1;
                console.log(userCount);
                resultDiv.innerHTML = 'User Wins';
                userInfo.innerHTML = userCount;
                resultDiv.style.backgroundColor = 'green';
            } else {
                compCount = compCount + 1;
                console.log(compCount);
                console.log("Computer Wins");
                resultDiv.innerHTML = 'Computer Wins';
                compInfo.innerHTML = compCount;
                resultDiv.style.backgroundColor = 'red';
            }
        });
    });
    let resetGame = document.getElementById('resetGame');
    resetGame.addEventListener('click', () => {
        userCount = 0;
        compCount = 0;
        userInfo.innerHTML = 0;
        compInfo.innerHTML = 0;
        resultDiv.innerHTML = 'Pick Your Move';
        resultDiv.style.backgroundColor = '#000';
    })
</script>

</html>
